<html lang="en">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prayas Jadaun — Full-stack Mobile App Developer building Android and iOS apps with Flutter and Django."
    />
    <meta name="theme-color" content="#0b3558" />
    <title>Prayas Jadaun — Mobile App Developer</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a light flash.
      try {
        var t = localStorage.getItem('theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
